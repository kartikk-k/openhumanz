<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glass Orb — Voice Reactor Playground</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0a0c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #glcanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ── Control panel ─────────────────────────────── */
  #panel {
    position: fixed; top: 16px; right: 16px; width: 300px; max-height: calc(100vh - 32px);
    overflow-y: auto; padding: 16px; border-radius: 16px;
    background: rgba(20,20,26,0.82); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    color: #e8e8ec; font-size: 12px; z-index: 10;
  }
  #panel h2 { font-size: 13px; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.02em; }
  #panel .hint { font-size: 11px; opacity: 0.5; margin-bottom: 14px; line-height: 1.4; }
  .group { margin-bottom: 14px; }
  .group > label.title { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.45; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .row label { flex: 0 0 96px; opacity: 0.8; font-size: 11px; }
  .row input[type=range] { flex: 1; height: 3px; accent-color: #ffb26b; background: rgba(255,255,255,0.12); border-radius: 2px; }
  .row .val { flex: 0 0 40px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.6; font-size: 10px; }
  .row input[type=color] { width: 34px; height: 22px; border: none; border-radius: 6px; background: none; cursor: pointer; padding: 0; }
  .row select { flex: 1; background: rgba(255,255,255,0.06); color: #e8e8ec; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 8px; font-size: 11px; }
  .btnrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .btnrow button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #e8e8ec; cursor: pointer; font-size: 11px; transition: 0.15s; }
  .btnrow button:hover { background: rgba(255,255,255,0.12); }
  .btnrow button.active { background: #ffb26b; color: #1a1000; border-color: transparent; font-weight: 600; }
  #dump { width: 100%; margin-top: 6px; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #ffb26b; color: #1a1000; font-weight: 600; cursor: pointer; font-size: 11px; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<div id="panel">
  <h2>Glass Orb Reactor</h2>
  <p class="hint">Simulated voice / thinking reactive glass blob. Drag to tune, then "Copy uniforms".</p>

  <div class="group">
    <label class="title">State</label>
    <div class="btnrow" id="states">
      <button data-state="idle" class="active">Idle</button>
      <button data-state="speaking">Speaking</button>
      <button data-state="thinking">Thinking</button>
    </div>
  </div>

  <div class="group">
    <label class="title">Shape</label>
    <div class="row"><label>Lobes</label><input type="range" id="uLobes" min="0" max="12" step="1" value="5"><span class="val"></span></div>
    <div class="row"><label>Lobe depth</label><input type="range" id="uLobeDepth" min="0" max="0.6" step="0.01" value="0.18"><span class="val"></span></div>
    <div class="row"><label>Radius</label><input type="range" id="uRadius" min="0.15" max="0.55" step="0.01" value="0.34"><span class="val"></span></div>
    <div class="row"><label>Roundness</label><input type="range" id="uRound" min="0.2" max="1.5" step="0.01" value="0.7"><span class="val"></span></div>
    <div class="row"><label>Layers</label><input type="range" id="uLayers" min="1" max="5" step="1" value="3"><span class="val"></span></div>
    <div class="row"><label>Layer gap</label><input type="range" id="uLayerGap" min="0.02" max="0.2" step="0.005" value="0.07"><span class="val"></span></div>
    <div class="row"><label>Wobble</label><input type="range" id="uWobble" min="0" max="0.15" step="0.005" value="0.03"><span class="val"></span></div>
  </div>

  <div class="group">
    <label class="title">Glass</label>
    <div class="row"><label>Refraction</label><input type="range" id="uRefract" min="0" max="0.15" step="0.002" value="0.045"><span class="val"></span></div>
    <div class="row"><label>Rim width</label><input type="range" id="uRimWidth" min="0.002" max="0.06" step="0.001" value="0.014"><span class="val"></span></div>
    <div class="row"><label>Rim glow</label><input type="range" id="uRimGlow" min="0" max="3" step="0.05" value="1.4"><span class="val"></span></div>
    <div class="row"><label>Frost</label><input type="range" id="uFrost" min="0" max="1" step="0.02" value="0.35"><span class="val"></span></div>
    <div class="row"><label>Fresnel</label><input type="range" id="uFresnel" min="0" max="4" step="0.05" value="1.8"><span class="val"></span></div>
    <div class="row"><label>Glass opacity</label><input type="range" id="uGlassOp" min="0" max="1" step="0.02" value="0.5"><span class="val"></span></div>
  </div>

  <div class="group">
    <label class="title">Glow / Core</label>
    <div class="row"><label>Core glow</label><input type="range" id="uCoreGlow" min="0" max="3" step="0.05" value="1.5"><span class="val"></span></div>
    <div class="row"><label>Core size</label><input type="range" id="uCoreSize" min="0.05" max="0.5" step="0.01" value="0.22"><span class="val"></span></div>
    <div class="row"><label>Bloom</label><input type="range" id="uBloom" min="0" max="2" step="0.05" value="0.7"><span class="val"></span></div>
    <div class="row"><label>Rays</label><input type="range" id="uRays" min="0" max="1" step="0.02" value="0.4"><span class="val"></span></div>
  </div>

  <div class="group">
    <label class="title">Color</label>
    <div class="row"><label>Core</label><input type="color" id="cCore" value="#fff2d8"><label style="flex:0 0 60px">Mid</label><input type="color" id="cMid" value="#ffb26b"></div>
    <div class="row"><label>Rim</label><input type="color" id="cRim" value="#ffd28a"><label style="flex:0 0 60px">BG</label><input type="color" id="cBg" value="#2a2016"></div>
  </div>

  <div class="group">
    <label class="title">Motion</label>
    <div class="row"><label>Amplitude</label><input type="range" id="uAmp" min="0" max="1" step="0.02" value="0.15"><span class="val"></span></div>
    <div class="row"><label>Speed</label><input type="range" id="uSpeed" min="0" max="3" step="0.05" value="1"><span class="val"></span></div>
    <div class="row"><label>Rotate</label><input type="range" id="uRotate" min="-1" max="1" step="0.02" value="0.06"><span class="val"></span></div>
  </div>

  <button id="dump">Copy uniforms as JSON</button>
</div>

<script type="x-shader/x-fragment" id="frag">
precision highp float;
varying vec2 vUv;
uniform vec2  uResolution;
uniform float uTime;

// audio-ish drive
uniform float uLevel;   // 0..1 instantaneous "voice level"
uniform float uPulse;   // 0..1 slow thinking pulse

// shape
uniform float uLobes, uLobeDepth, uRadius, uRound, uLayers, uLayerGap, uWobble;
// glass
uniform float uRefract, uRimWidth, uRimGlow, uFrost, uFresnel, uGlassOp;
// glow
uniform float uCoreGlow, uCoreSize, uBloom, uRays;
// motion
uniform float uAmp, uSpeed, uRotate;
// color
uniform vec3 cCore, cMid, cRim, cBg;

const float TAU = 6.28318530718;

// hash / noise
float hash(vec2 p){ p = fract(p*vec2(123.34,345.45)); p += dot(p,p+34.345); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}

mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }

// signed-ish distance to a wobbly multi-lobe blob at given scale
// returns radial distance field value: d = len - shapeRadius(angle)
float blobField(vec2 p, float scale, float t){
  float ang = atan(p.y, p.x);
  float len = length(p);
  float lobes = uLobes;
  // petal modulation
  float petal = 0.0;
  if(lobes > 0.5){
    petal = pow(abs(cos(ang*lobes*0.5)), uRound) * uLobeDepth;
  }
  // organic wobble (animated)
  float w = uWobble * (0.6 + 0.8*uLevel);
  petal += w * sin(ang*3.0 + t*1.3);
  petal += w * 0.6 * sin(ang*7.0 - t*0.9);
  float r = (uRadius*scale) * (1.0 + petal * (1.0 + 0.5*uLevel));
  return len - r;
}

// soft glowing core with radial rays
float coreGlow(vec2 p, float t){
  float d = length(p);
  float core = smoothstep(uCoreSize*(1.0+0.4*uLevel), 0.0, d);
  core = pow(core, 1.6);
  // radial rays
  float ang = atan(p.y,p.x);
  float rays = 0.5 + 0.5*sin(ang*uLobes + t*0.5);
  rays = mix(1.0, rays, uRays);
  return core * rays;
}

void main(){
  vec2 uv = vUv;
  // aspect-correct centered coords
  vec2 p = (uv - 0.5);
  p.x *= uResolution.x / uResolution.y;

  float t = uTime * uSpeed;
  // global drive from voice level + thinking pulse
  float drive = uLevel;
  float breathe = 1.0 + uAmp*(0.06*sin(t*1.1) + 0.10*drive + 0.05*uPulse*sin(t*2.3));
  p /= breathe;
  p *= rot(uRotate * uTime + uPulse*0.3*sin(t*0.7));

  vec3 col = cBg;
  // subtle vignette background
  col = mix(cBg*1.15, cBg*0.6, smoothstep(0.0, 0.9, length(p)));

  int LAYERS = int(uLayers);
  // draw from outermost to innermost so inner glass sits on top
  float glassAccum = 0.0;
  for(int i=4;i>=0;i--){
    if(i >= LAYERS) continue;
    float fi = float(i);
    float scale = 1.0 + fi*uLayerGap/uRadius; // outer layers larger
    float layerT = t + fi*0.6;

    // refraction offset sampled from noise so glass bends light
    vec2 rp = p;
    float nf = noise(p*6.0 + layerT*0.2);
    rp += (nf-0.5) * uRefract * (1.0 + drive);

    float d = blobField(rp, scale, layerT);

    // glass body (inside the blob)
    float inside = smoothstep(0.004, -0.004, d);
    // frosted interior tint — sample noise for milky glass
    float frost = mix(1.0, 0.6+0.5*noise(p*10.0+fi), uFrost);
    // fresnel: brighter toward the rim
    float rimDist = abs(d);
    float fres = pow(1.0 - smoothstep(0.0, uRadius*0.5*scale, rimDist), uFresnel);

    // layer glass color: outer layers cooler/dimmer, inner warmer
    float layerMix = 1.0 - fi/max(1.0,float(LAYERS));
    vec3 glassCol = mix(cMid, cCore, layerMix*0.6);
    float op = uGlassOp * (0.4 + 0.6*layerMix);

    col = mix(col, glassCol*frost, inside*op);
    // fresnel sheen on the body
    col += glassCol * fres * inside * 0.25;

    // bright rim highlight (the gold/blue edge line)
    float rim = smoothstep(uRimWidth, 0.0, abs(d));
    float rimPulse = 0.7 + 0.6*drive + 0.3*uPulse;
    col += cRim * rim * uRimGlow * rimPulse;

    glassAccum += inside;
  }

  // ── glowing core (on top) ─────────────────────────
  float g = coreGlow(p, t);
  float coreDrive = uCoreGlow * (0.7 + 0.9*drive + 0.4*uPulse);
  col += cCore * g * coreDrive;
  // warm mid halo around core
  float halo = smoothstep(uCoreSize*2.2, 0.0, length(p));
  col += cMid * halo * uBloom * (0.4+0.6*drive);

  // outer bloom glow of the whole shape
  float outerGlow = smoothstep(uRadius*1.9, 0.0, length(p));
  col += cMid * outerGlow * 0.15 * (0.5+drive);

  // subtle grain to kill banding
  col += (hash(uv*uResolution + uTime)-0.5) * 0.012;

  // tone
  col = col / (1.0 + col*0.35); // soft filmic
  col = pow(max(col,0.0), vec3(0.95));

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl', { antialias: true, premultipliedAlpha: false });
if(!gl){ alert('WebGL not supported'); }

const VERT = `attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// uniform locations
const U = {};
function loc(n){ return U[n] || (U[n]=gl.getUniformLocation(prog,n)); }

function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }

// gather controls
const floats = ['uLobes','uLobeDepth','uRadius','uRound','uLayers','uLayerGap','uWobble',
  'uRefract','uRimWidth','uRimGlow','uFrost','uFresnel','uGlassOp',
  'uCoreGlow','uCoreSize','uBloom','uRays','uAmp','uSpeed','uRotate'];
const colors = { cCore:'cCore', cMid:'cMid', cRim:'cRim', cBg:'cBg' };

function updateVals(){
  document.querySelectorAll('.row').forEach(r=>{
    const inp = r.querySelector('input[type=range]'); const v = r.querySelector('.val');
    if(inp && v) v.textContent = parseFloat(inp.value).toFixed(inp.step.includes('.')?( inp.step.length-2):0);
  });
}
floats.forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', updateVals); });
updateVals();

// ── state presets (drive different reactive behavior) ──
const STATES = {
  idle:      { level: ()=> 0.06 + 0.04*Math.sin(T*0.8), pulse: 0.0 },
  speaking:  { level: ()=> Math.max(0, sim()), pulse: 0.0 },
  thinking:  { level: ()=> 0.12 + 0.05*Math.sin(T*3), pulse: ()=> 0.5+0.5*Math.sin(T*1.4) },
};
let state = 'idle';
document.querySelectorAll('#states button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#states button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); state = b.dataset.state;
  });
});

// simulated voice envelope (bursts of speech)
let T=0, simLevel=0, simTarget=0, nextChange=0;
function sim(){
  if(T > nextChange){
    // random speech bursts + pauses
    simTarget = Math.random() > 0.25 ? (0.4 + Math.random()*0.6) : 0.02;
    nextChange = T + 0.08 + Math.random()*0.25;
  }
  // add jitter like real speech
  const jitter = simTarget>0.1 ? (Math.random()-0.5)*0.4*simTarget : 0;
  simLevel += ((simTarget+jitter) - simLevel) * 0.25;
  return simLevel;
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize); resize();

let start = performance.now();
function frame(now){
  T = (now - start)/1000;
  gl.uniform2f(loc('uResolution'), canvas.width, canvas.height);
  gl.uniform1f(loc('uTime'), T);

  const st = STATES[state];
  const level = typeof st.level==='function' ? st.level() : st.level;
  const pulse = typeof st.pulse==='function' ? st.pulse() : st.pulse;
  gl.uniform1f(loc('uLevel'), level);
  gl.uniform1f(loc('uPulse'), pulse);

  floats.forEach(id=> gl.uniform1f(loc(id), parseFloat(document.getElementById(id).value)));
  for(const k in colors){ gl.uniform3fv(loc(k), hexToRgb(document.getElementById(k).value)); }

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── copy uniforms ─────────────────────────────
document.getElementById('dump').addEventListener('click', ()=>{
  const out = {};
  floats.forEach(id=> out[id] = parseFloat(document.getElementById(id).value));
  for(const k in colors) out[k] = document.getElementById(k).value;
  const txt = JSON.stringify(out, null, 2);
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('dump'); const o=b.textContent;
    b.textContent='Copied ✓'; setTimeout(()=>b.textContent=o, 1200);
  });
  console.log(txt);
});
</script>
</body>
</html>
